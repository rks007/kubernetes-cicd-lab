apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-app-deployment
  namespace: kustom
  labels:
    app: blog-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blog-app
  template:
    metadata:
      labels:
        app: blog-app
    spec:
      containers:
        - name: blog-app-container
          image: rks007/kustomize:5eb1d6311a08f309adb6d34bfc33072869614711
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: kustom-config