name:  CI Pipeline
on:
  push:
    branches:
      - master
    paths-ignore:
      - "README.md"
      - "Kubernetes/**"
  
jobs:
  gitleaks-scan:
    name: Gitleaks Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Gitleaks Scan
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest detect \
            --source=/repo \
            --report-format=json \
            --report-path=/repo/gitleaks-report.json \
            --redact \
            --exit-code 0
            
      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: warn
          

  trivy-fs-scan:
    name: Trivy FS Scan
    runs-on: ubuntu-latest
    needs: gitleaks-scan
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: latest
          cache: true

      - name: Verify Trivy installation
        run: |
          trivy --version
          which trivy

      - name: Run Trivy FS scan (JSON)
        run: |
          trivy fs . \
            --format json \
            --output trivy-fs-report.json \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0

      - name: Run Trivy FS scan (TABLE)
        run: |
          trivy fs . \
            --format table \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 > trivy-fs-report.txt

      - name: Upload Trivy JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-json-report
          path: trivy-fs-report.json
          if-no-files-found: warn

      - name: Upload Trivy TABLE report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-table-report
          path: trivy-fs-report.txt
          if-no-files-found: warn

  build-scan-and-push:
    runs-on: ubuntu-latest
    needs: trivy-fs-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
 
      - name: Build docker image
        run: docker build -t ${{ vars.DOCKERHUB_USERNAME }}/kustomize:${{ github.sha }} .
 
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: latest
          cache: true
 
      - name: Run Trivy image scan (JSON)
        run: |
          trivy image ${{ vars.DOCKERHUB_USERNAME }}/kustomize:${{ github.sha }} \
            --format json \
            --output image-trivy-report.json \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0
 
      - name: Run Trivy image scan (TABLE)
        run: |
          trivy image ${{ vars.DOCKERHUB_USERNAME }}/kustomize:${{ github.sha }} \
            --format table \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 > image-trivy-report.txt
 
      - name: Upload Trivy image JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-trivy-json-report
          path: image-trivy-report.json
          if-no-files-found: warn
 
      - name: Upload Trivy image TABLE report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-trivy-table-report
          path: image-trivy-report.txt
          if-no-files-found: warn

      - name: Generate source SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: source-sbom.spdx.json
          upload-artifact: true

      - name: Generate image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ vars.DOCKERHUB_USERNAME }}/kustomize:${{ github.sha }}
          format: spdx-json
          output-file: image-sbom.spdx.json
          upload-artifact: true      
 
      - name: Push docker image
        run: docker push ${{ vars.DOCKERHUB_USERNAME }}/kustomize:${{ github.sha }}

  update-image-in-manifest:
    name: Update image in Manifest
    needs: build-scan-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Update image tag in manifest
        run: |
          sed -i "s|image: ${{ vars.DOCKERHUB_USERNAME }}/kustomize:.*|image: ${{ vars.DOCKERHUB_USERNAME }}/kustomize:${GITHUB_SHA}|g" kubernetes/application/deployment.yml

      - name: Show updated manifest (debug)
        run: |
          cat kubernetes/application/deployment.yml

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kubernetes/application/deployment.yml
          git commit -m "Update deployment.yml image to ${GITHUB_SHA} [skip ci]" || echo "No changes to commit"
          git push origin master    

